name: Purge jsDelivr Cache

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Purge jsDelivr CDN Cache
        run: |
          REF="${GITHUB_REF_NAME:-dev}"
          echo "Purging jsDelivr edge cache for @${REF}..."

          FILES=(
            "opynix-tryon.js"
            "assets/face-quality.worker.js"
          )

          FAILED=0
          for FILE in "${FILES[@]}"; do
            echo "--- Purging: ${FILE} ---"
            response=$(curl -s -w "\n%{http_code}" -X GET "https://purge.jsdelivr.net/gh/OPYNIX-TECH/tryon-popup-script@${REF}/${FILE}")
            body=$(echo "$response" | head -n -1)
            http_code=$(echo "$response" | tail -n 1)

            echo "Response HTTP Status: $http_code"
            echo "Response Body: $body"

            if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
              echo "Successfully purged ${FILE}!"
            else
              echo "Failed to purge ${FILE} (HTTP $http_code)"
              FAILED=1
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi
